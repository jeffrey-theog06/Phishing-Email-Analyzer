apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishinganalyzer-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phishinganalyzer
  template:
    metadata:
      labels:
        app: phishinganalyzer
    spec:
      containers:
      - name: phishinganalyzer
        image: phishinganalyzer:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: phishinganalyzer-service
spec:
  type: NodePort
  selector:
    app: phishinganalyzer
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
